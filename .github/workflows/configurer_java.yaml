name: Configurer java

on:
  workflow_dispatch:

jobs:
  build:
   runs-on: ubuntu-latest

   steps:
    - name: Get source code
      uses: actions/checkout@v7

    - name: read files
      run: ls

    - name: Config jdk 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: build maven
      run: mvn -B clean package -DskipTests

    - name: Save artefacts
      uses: actions/upload-artifact@v7
      with:
        name: java-artifact
        path: target/*.jar